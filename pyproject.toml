[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "witnessbench"
version = "0.1.0"
description = "WitnessBench tests whether a model can discover the rules of a game by playing it: line-puzzle games, the text-only agent harness, evaluators and RL training code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Guanghan Ning" },
    { name = "Ping Liu" },
    { name = "Linyi Li" },
    { name = "Huangjie Zheng" },
    { name = "Arjun Neervannan" },
    { name = "Huu Nguyen" },
    { name = "Michael Sklar" },
    { name = "Deniz Zorlu" },
    { name = "Nicolai Ouporov" },
]
keywords = ["benchmark", "llm-agents", "rule-discovery", "puzzles", "reinforcement-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "arcengine==0.9.3",
    "numpy>=1.26",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
eval = ["httpx>=0.27"]
test = ["httpx>=0.27", "pytest>=8"]

[project.urls]
Homepage = "https://witnessbench.ai"
Paper = "https://arxiv.org/abs/2609.32208"
Repository = "https://github.com/fleet-ai/witnessbench"
Issues = "https://github.com/fleet-ai/witnessbench/issues"

[tool.setuptools.packages.find]
include = ["witness_env*", "witness_agent*", "witness_game*", "witness_rl*"]

[tool.setuptools.package-data]
witness_env = ["levels/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120
extend-exclude = ["transfer"]   # the evaluation scripts exactly as they produced the paper's numbers

[tool.ruff.lint]
select = ["E", "F", "W"]
